[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tollgate"
version = "0.1.0"
description = "Tollgate: a deterministic admission gate for AI agents — scores, budgets, compresses and audits every candidate context before it reaches a provider."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Julio Pessan" }]
requires-python = ">=3.10"
keywords = [
  "tokens", "context", "llm", "ast", "semantic-search", "headroom", "bm25",
  "agents", "context-engineering", "finops", "cost-governance", "guardrails",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.2"]
providers = ["openai>=2.46.0,<3.0.0", "anthropic>=0.117.0,<1.0.0", "PyYAML>=6.0.3,<7.0.0"]
dev = ["pytest>=9.1.1,<10.0.0", "mypy>=1.5", "ruff>=0.5"]

[project.scripts]
tollgate = "tollgate.context.cli:main"

[project.urls]
Homepage = "https://github.com/juliopessan/toolgate"
Source = "https://github.com/juliopessan/toolgate"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tollgate*"]

[tool.setuptools.package-data]
tollgate = [
  "governance/store/migrations/*.sql",
  "governance/store/pricing.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
