[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-ledger"
version = "0.1.0"
description = "Context Ledger: a scored context toolkit (tokens, headroom, AST, semantic pack) unified with a deterministic FinOps governance runtime (Guardian, Waste Ledger, thermal-tier dispatch) for AI agents."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Julio Pessan" }]
requires-python = ">=3.10"
keywords = [
  "tokens", "context", "llm", "ast", "semantic-search", "headroom", "bm25",
  "agents", "context-engineering", "finops", "cost-governance", "guardrails",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.2"]
providers = ["openai>=2.46.0,<3.0.0", "anthropic>=0.117.0,<1.0.0", "PyYAML>=6.0.3,<7.0.0"]
dev = ["pytest>=9.1.1,<10.0.0", "mypy>=1.5", "ruff>=0.5"]

[project.scripts]
context-ledger = "context_ledger.context.cli:main"

[project.urls]
Homepage = "https://github.com/juliopessan/context-ledger"
Source = "https://github.com/juliopessan/context-ledger"

[tool.setuptools.packages.find]
where = ["src"]
include = ["context_ledger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
